name: DriftAI requirement check

on:
  pull_request:
    paths:
      - "REQUIREMENTS.md"
      - "docs/requirements*.md"

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find affected functions
        run: >
          python backend/pr_check.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --repo .
          --out comment.md

      - name: Show result in the job summary
        run: cat comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          ID=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[] | select(.body | contains("<!-- driftai-pr-comment -->")) | .id' | head -n1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$ID" -F body=@comment.md
          else
            gh pr comment "$PR" --body-file comment.md
          fi